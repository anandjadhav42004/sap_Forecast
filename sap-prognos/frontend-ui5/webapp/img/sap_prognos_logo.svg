<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="10" y="10" width="180" height="180" rx="44" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.4" />

  <!-- Grid lines -->
  <line x1="40" y1="140" x2="160" y2="140" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="40" y1="100" x2="160" y2="100" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="40" y1="60"  x2="160" y2="60"  stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Area under curve -->
  <path d="M 45 135 Q 75 125 95 90 T 135 75 T 155 45 L 155 140 L 45 140 Z" fill="url(#glowGrad)" />

  <!-- Trend Forecast Line with Glow -->
  <path d="M 45 135 Q 75 125 95 90 T 135 75 T 155 45" fill="none" stroke="url(#chartGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Data Nodes -->
  <circle cx="45"  cy="135" r="4.5" fill="#38bdf8" stroke="#0f172a" stroke-width="2" />
  <circle cx="95"  cy="90"  r="5"   fill="#818cf8" stroke="#0f172a" stroke-width="2" />
  <circle cx="135" cy="75"  r="5"   fill="#a855f7" stroke="#0f172a" stroke-width="2" />
  <circle cx="155" cy="45"  r="6"   fill="#38bdf8" stroke="#ffffff" stroke-width="2.5" />

  <!-- Pulse beacon around future point -->
  <circle cx="155" cy="45" r="11" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="2 3" />
</svg>
